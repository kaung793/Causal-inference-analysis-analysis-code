name: R syntax and repository checks

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
      - name: Run dependency-free checks
        run: Rscript tests/static_checks.R
